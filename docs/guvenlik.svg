<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  </defs>
  <rect width="960" height="330" rx="18" fill="url(#bg)" stroke="#d6dde6"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Hesabını koruyan sınırlar</text>
  <text x="40" y="78" font-size="14" fill="#475569">DeepSeek web sohbeti bir API değil. c2f mesajları normal bir insanın kullanımı gibi tutar.</text>

  <g>
    <rect x="40" y="100" width="206" height="96" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="60" y="140" font-size="28" font-weight="800" fill="#2563eb">30.000</text>
    <text x="60" y="166" font-size="13" fill="#334155">karakter / mesaj</text>
    <text x="60" y="184" font-size="12" fill="#64748b">mesajda bir dosya ya da sınıf</text>
  </g>
  <g>
    <rect x="264" y="100" width="206" height="96" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="284" y="140" font-size="28" font-weight="800" fill="#2563eb">15 sn</text>
    <text x="284" y="166" font-size="13" fill="#334155">iki mesaj arası en az</text>
    <text x="284" y="184" font-size="12" fill="#64748b">makine hızı yok</text>
  </g>
  <g>
    <rect x="488" y="100" width="206" height="96" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="508" y="140" font-size="28" font-weight="800" fill="#2563eb">2 dk</text>
    <text x="508" y="166" font-size="13" fill="#334155">iki yeni sohbet arası</text>
    <text x="508" y="184" font-size="12" fill="#64748b">sohbet sohbet gezinmek yok</text>
  </g>
  <g>
    <rect x="712" y="100" width="208" height="96" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="732" y="140" font-size="28" font-weight="800" fill="#2563eb">10 dk</text>
    <text x="732" y="166" font-size="13" fill="#334155">aynı mesaj tekrar gitmez</text>
    <text x="732" y="184" font-size="12" fill="#64748b">modeller bazen tekrarlar</text>
  </g>

  <rect x="40" y="214" width="430" height="88" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="60" y="242" font-size="15" font-weight="700" fill="#166534">Varsayılan: yalnızca danışma</text>
  <text x="60" y="266" font-size="13" fill="#166534">Kısa sorularda ve küçük işlerde mesaj gitmez.</text>
  <text x="60" y="287" font-size="13" fill="#166534">Toplam sınır yok: kota dolunca beklenir, sen bilgilendirilirsin.</text>

  <rect x="490" y="214" width="430" height="88" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="510" y="242" font-size="15" font-weight="700" fill="#991b1b">Kapalı: DeepSeek'i API gibi sürmek</text>
  <text x="510" y="266" font-size="13" fill="#991b1b">build, model uç noktası, c2f_chat (automation).</text>
  <text x="510" y="287" font-size="13" fill="#991b1b">Bir hesap bu tür kullanımdan sonra askıya alındı.</text>
</svg>
