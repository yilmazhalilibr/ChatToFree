<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  </defs>
  <rect width="960" height="360" rx="18" fill="url(#bg)" stroke="#d6dde6"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Yerleşik debug katmanı</text>
  <text x="40" y="78" font-size="14" fill="#475569">Ajan yazdığı her programa tek anahtarlı bir hata ayıklama katmanı koyar; hata çıkınca kanıtla danışır.</text>

  <!-- switch off -->
  <rect x="40" y="102" width="270" height="200" rx="14" fill="#fff" stroke="#cbd5e1"/>
  <rect x="62" y="124" width="64" height="32" rx="16" fill="#cbd5e1"/><circle cx="78" cy="140" r="12" fill="#fff"/>
  <text x="140" y="146" font-size="16" font-weight="700" fill="#0f172a">Kapalı (varsayılan)</text>
  <text x="62" y="186" font-size="13.5" fill="#334155">Mesaj hiç oluşturulmaz:</text>
  <rect x="62" y="198" width="226" height="30" rx="7" fill="#0f172a"/>
  <text x="74" y="218" font-size="12" fill="#e2e8f0" font-family="Consolas, monospace">if (!DEBUG) return;</text>
  <text x="62" y="256" font-size="13.5" fill="#334155">Release'te yük yok, çıktı temiz.</text>
  <text x="62" y="280" font-size="13.5" fill="#334155">Hatalar yine de gizlenmez.</text>

  <line x1="314" y1="200" x2="342" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- switch on -->
  <rect x="348" y="102" width="300" height="200" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <rect x="370" y="124" width="64" height="32" rx="16" fill="#16a34a"/><circle cx="418" cy="140" r="12" fill="#fff"/>
  <text x="448" y="146" font-size="16" font-weight="700" fill="#0f172a">APP_DEBUG=1</text>
  <rect x="370" y="170" width="256" height="112" rx="8" fill="#0f172a"/>
  <g font-size="11.5" font-family="Consolas, monospace">
    <text x="382" y="192" fill="#93c5fd">[cli.main] komut: ekle</text>
    <text x="382" y="212" fill="#93c5fd">[storage.load] 3 not okundu</text>
    <text x="382" y="232" fill="#93c5fd">[storage.save] notes.json yazılıyor</text>
    <text x="382" y="252" fill="#fca5a5">[storage.save] EACCES: izin yok</text>
    <text x="382" y="272" fill="#64748b">→ stderr, normal çıktıya karışmaz</text>
  </g>

  <line x1="652" y1="200" x2="680" y2="200" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- consult -->
  <rect x="686" y="102" width="234" height="200" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="706" y="136" font-size="16" font-weight="700" fill="#0f172a">Blok bulundu</text>
  <text x="706" y="164" font-size="13.5" fill="#334155">Çözebiliyorsa düzeltir.</text>
  <text x="706" y="186" font-size="13.5" fill="#334155">Çözemezse danışır:</text>
  <rect x="704" y="198" width="198" height="86" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="714" y="220" font-size="12.5" fill="#5b21b6">“[storage.save] bloğunda</text>
  <text x="714" y="239" font-size="12.5" fill="#5b21b6">EACCES alıyorum, şu iki satır</text>
  <text x="714" y="258" font-size="12.5" fill="#5b21b6">ve şu girdi… sence sebep</text>
  <text x="714" y="277" font-size="12.5" fill="#5b21b6">ne olabilir?”</text>

  <text x="40" y="332" font-size="13" fill="#475569">Birkaç satırlık betiklere katman eklenmez. Parola, anahtar ve kişisel veri loglanmaz.</text>
</svg>
