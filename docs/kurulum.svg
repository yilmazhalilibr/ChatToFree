<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  </defs>
  <rect width="960" height="330" rx="18" fill="url(#bg)" stroke="#d6dde6"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">Kurulum · her bilgisayarda bir kez</text>
  <text x="40" y="78" font-size="14" fill="#475569">Klasör adında boşluk ve Türkçe harf olabilir. Yönetici izni gerekmez.</text>

  <g>
    <rect x="40" y="105" width="190" height="170" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="74" cy="139" r="18" fill="#2563eb"/><text x="74" y="145" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="102" y="145" font-size="16" font-weight="700" fill="#0f172a">Hazırlık</text>
    <text x="60" y="185" font-size="13.5" fill="#334155">Node.js 20+</text>
    <text x="60" y="209" font-size="13.5" fill="#334155">OpenCode (ya da başka</text>
    <text x="60" y="229" font-size="13.5" fill="#334155">bir ajan)</text>
  </g>
  <line x1="234" y1="190" x2="262" y2="190" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <g>
    <rect x="268" y="105" width="190" height="170" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="302" cy="139" r="18" fill="#2563eb"/><text x="302" y="145" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="330" y="145" font-size="16" font-weight="700" fill="#0f172a">İndir</text>
    <rect x="286" y="172" width="154" height="54" rx="8" fill="#0f172a"/>
    <text x="298" y="194" font-size="11.5" fill="#e2e8f0" font-family="Consolas, monospace">git clone .../</text>
    <text x="298" y="213" font-size="11.5" fill="#e2e8f0" font-family="Consolas, monospace">  ChatToFree</text>
    <text x="286" y="252" font-size="13" fill="#475569">ya da ZIP indir, aç</text>
  </g>
  <line x1="462" y1="190" x2="490" y2="190" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <g>
    <rect x="496" y="105" width="190" height="170" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="530" cy="139" r="18" fill="#7c3aed"/><text x="530" y="145" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="558" y="145" font-size="16" font-weight="700" fill="#0f172a">Kur.bat</text>
    <text x="516" y="185" font-size="13.5" fill="#334155">çift tıkla, açılan</text>
    <text x="516" y="205" font-size="13.5" fill="#334155">pencerede <tspan font-weight="700">kendi</tspan></text>
    <text x="516" y="225" font-size="13.5" fill="#334155">DeepSeek hesabına gir,</text>
    <text x="516" y="245" font-size="13.5" fill="#334155">pencereyi kapat</text>
  </g>
  <line x1="690" y1="190" x2="718" y2="190" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#a)"/>
  <g>
    <rect x="724" y="105" width="196" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="758" cy="139" r="18" fill="#16a34a"/><path d="M749 139l6 6l12-13" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="786" y="145" font-size="16" font-weight="700" fill="#0f172a">Hazır</text>
    <text x="742" y="183" font-size="12.5" fill="#166534">✓ c2f her klasörde</text>
    <text x="742" y="204" font-size="12.5" fill="#166534">✓ OpenCode'a eklendi</text>
    <text x="742" y="225" font-size="12.5" fill="#166534">✓ masaüstü yenilendi</text>
    <rect x="740" y="236" width="164" height="26" rx="6" fill="#dcfce7"/>
    <text x="822" y="254" font-size="12.5" text-anchor="middle" fill="#14532d" font-family="Consolas, monospace">c2f durum</text>
  </g>
  <text x="40" y="306" font-size="13" fill="#475569">Giriş dosyası alındığı bilgisayara bağlıdır: kopyalanırsa çalışmaz. Klasörü taşıdıysan yeni yerinde Kur.bat'ı tekrar çalıştır.</text>
